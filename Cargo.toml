[package]
name = "cribler"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["cet"]
description = "Statistical randomness-test toolkit (chi-squared, serial, runs, KS, birthday spacing, NIST SP 800-22, paranoid meta-test). Batteries-included layer over cribler_core."
repository = "https://github.com/cet-t/cribler"
keywords = ["random", "rng", "statistics", "testing", "nist"]
categories = ["algorithms", "science", "development-tools::testing"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[dependencies]
cribler_core = { path = "cribler_core", version = "0.1.0" }
rand_core = { version = "0.10", optional = true }
urng = { version = "0.9", optional = true }
paste = { version = "1", optional = true }
hashbrown = { version = "0.17", features = ["serde"] }
thiserror = "2"
serde = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
rand = { version = "0.10", default-features = false, features = ["std_rng"] }
rand_core = "0.10"
urng = "0.9"
anyhow = "1"
rand_sfc = "0.2"
serde_json = "1.0"

[features]
rand = ["dep:rand_core"]
urng = ["dep:urng", "dep:paste"]
serde = ["dep:serde", "cribler_core/serde"]

[[example]]
name = "test"
required-features = ["rand", "urng"]
