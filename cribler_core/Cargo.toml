[package]
name = "cribler_core"
version = "0.3.0"
edition = "2024"
license = "MIT"
authors = ["cet"]
description = "Core statistical randomness-test engines (closure-based, RNG-library-agnostic). Extend via cribler."
repository = "https://github.com/cet-t/cribler"
keywords = ["no_std", "random", "rng", "statistics", "testing", "randomness"]
categories = ["algorithms", "science", "development-tools::testing"]

[dependencies]
thiserror = "2"
serde = { version = "1", optional = true, features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[features]
serde = ["dep:serde"]
